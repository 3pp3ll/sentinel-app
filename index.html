<script>
(function () { try {
  var ls = localStorage, t = ls.getItem("sentinel-theme");
  if (t !== "neon" && t !== "corp") { t = (t === "light") ? "corp" : "neon"; ls.setItem("sentinel-theme", t); }
  document.documentElement.setAttribute("data-theme", t);
} catch (e) { document.documentElement.setAttribute("data-theme", "neon"); } })();
</script>
<link rel="manifest" href="manifest.webmanifest">

<style>
/* Layout: right rail on desktop, off-canvas drawer on phones; one page visible at a time. */
:root {
  --bg: #070C2B; --surface: #111948; --sunk: #0B1138; --line: #26306E;
  --fg: #F2F4FF; --muted: #A3ADDB; --accent: #8B7CFF; --accent-soft: #221D5C;
  --win: #3FE0A0; --win-soft: #0F2E33; --loss: #FF5C8A; --loss-soft: #33163A;
  --live: #6AA6FF; --live-soft: #1A2B6A; --wait-soft: #151C4F; --glow: rgba(124,108,255,.25);
  --shade: rgba(3,5,20,.6);
  --f-display: Calibri, Carlito, "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --f-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}

/* ===== الهوية المعتمدة 22-11: نيون الليل + المؤسسي المضيء ===== */
:root[data-theme="neon"] {
  --bg: #0D1547; --surface: #19215F; --sunk: #141B55; --line: #323E8C;
  --fg: #F4F6FF; --muted: #B6BFEA; --accent: #A193FF; --accent-soft: #221D5C; --accent2: #3FE0A0; --accent2-soft: #0F2E33;
  --win: #3FE0A0; --win-soft: #0F2E33; --loss: #FF5C8A; --loss-soft: #33163A;
  --live: #6AA6FF; --live-soft: #1A2B6A; --wait-soft: #151C4F; --glow: rgba(124,108,255,.25); --shade: rgba(3,5,20,.6);
  --c1: #B04DFF; --c2: #3D8BFF; --c3: #3FE0A0; --c4: #22D3EE;
  --glass: rgba(34,44,122,.42); --glass-brd: rgba(150,165,255,.32);
  --grad: linear-gradient(90deg, #3D8BFF, #B04DFF);
  color-scheme: dark; }
:root[data-theme="corp"] {
  --bg: #F5F8FF; --surface: #FFFFFF; --sunk: #EEF3FF; --line: #E2E8F6;
  --fg: #0B1E5B; --muted: #4F5E86; --accent: #1D4ED8; --accent-soft: #E6EDFC; --accent2: #F7731C; --accent2-soft: #FEEFE5; --accent2-text: #C2410C;
  --win: #137038; --win-soft: #E2F5E9; --loss: #B42318; --loss-soft: #FCE7E5;
  --live: #1D4ED8; --live-soft: #E6EDFC; --wait-soft: #EEF3FF; --glow: rgba(29,78,216,.08); --shade: rgba(11,30,91,.35);
  color-scheme: light;
  --c1: #1D4ED8; --c2: #1D4ED8; --c3: #1D4ED8; --c4: #1D4ED8;
  --glass: #FFFFFF; --glass-brd: #E2E8F6;
  --grad: linear-gradient(90deg, #1D4ED8, #2563EB); }
:root:is([data-theme="neon"],[data-theme="corp"]) { --f-display: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif; }
:root[data-theme="neon"] body { background: var(--bg); }
:root[data-theme="corp"] body { background:
  radial-gradient(55% 30% at 100% 0%, #DCE6FF, transparent 70%),
  radial-gradient(70% 28% at 15% 110%, rgba(29,78,216,.16), transparent 70%), var(--bg); background-attachment: fixed; }
/* البطاقات: زجاج */
:root:is([data-theme="neon"],[data-theme="corp"]) :is(.panel, .table-wrap, .empty, .trial, .cn-card, .dp-panel) { border-radius: 18px; }
:root[data-theme="neon"] :is(.panel, .table-wrap, .empty, .trial) { background: var(--glass); border-color: var(--glass-brd);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 0 0 1px rgba(150,165,255,.06), 0 16px 40px -22px rgba(110,90,255,.7); }
:root[data-theme="corp"] :is(.panel, .table-wrap, .empty, .trial) { box-shadow: 0 1px 2px rgba(11,30,91,.04), 0 12px 30px -18px rgba(29,78,216,.35); }
:root[data-theme="neon"] th { background: rgba(10,48,62,.62); color: #BFEFF5; }
/* الجداول واللوحات في الليلي: فيروزي من ألوان رادار وواحة بدل الأزرق */
:root[data-theme="neon"] :is(.panel, .table-wrap, .empty, .trial) { background: linear-gradient(160deg, rgba(18,62,86,.55), rgba(16,66,66,.48)); border-color: rgba(94,234,212,.28); }
:root[data-theme="neon"] :is(.table-wrap, .panel) :is(td, th) { border-color: rgba(94,234,212,.16); }
:root[data-theme="neon"] .panel .table-wrap { background: rgba(8,36,48,.35); }
:root[data-theme="corp"] th { background: #F2F6FF; }
/* القائمة الجانبية + أيقونات زجاج كأنها ثلج */
:root[data-theme="neon"] .rail { background: rgba(16,23,78,.72); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-color: var(--glass-brd); }
:root[data-theme="corp"] .rail { background: #FFFFFF; }
:root:is([data-theme="neon"],[data-theme="corp"]) .nav a { --c: var(--c2); padding-block: 7px; }
:root:is([data-theme="neon"],[data-theme="corp"]) .nav a:nth-child(4n+1) { --c: var(--c1); }
:root:is([data-theme="neon"],[data-theme="corp"]) .nav a:nth-child(4n+3) { --c: var(--c3); }
:root:is([data-theme="neon"],[data-theme="corp"]) .nav a:nth-child(4n) { --c: var(--c4); }
:root[data-theme="neon"] .nav a svg { box-sizing: content-box; padding: 8px; border-radius: 11px; opacity: 1; color: #fff;
  background: linear-gradient(180deg, rgba(255,255,255,.38), rgba(255,255,255,0) 48%), linear-gradient(150deg, rgba(255,255,255,.22), color-mix(in srgb, var(--c) 30%, transparent));
  border: 1px solid rgba(255,255,255,.5); box-shadow: inset 0 1px 0 rgba(255,255,255,.85), inset 0 -6px 12px color-mix(in srgb, var(--c) 35%, transparent), 0 6px 16px -6px var(--c);
  filter: drop-shadow(0 0 4px color-mix(in srgb, var(--c) 60%, transparent)); }
:root[data-theme="corp"] .nav a svg { box-sizing: content-box; padding: 8px; border-radius: 11px; opacity: 1; color: #1D4ED8;
  background: linear-gradient(180deg, #fff, #fff 45%, #DCE7FF); border: 1px solid #fff; box-shadow: inset 0 1px 0 #fff, 0 6px 16px -8px rgba(29,78,216,.6), 0 0 0 1px #E2E8F6; }
:root[data-theme="neon"] .nav a.on { background: color-mix(in srgb, var(--c) 16%, transparent); color: #fff; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 55%, transparent), 0 0 18px -6px var(--c); }
:root[data-theme="corp"] .nav a.on { background: #EEF3FF; color: #0B1E5B; box-shadow: inset -3px 0 0 var(--accent2); }
/* العنوان */
:root[data-theme="neon"] .hero { background: transparent; border-color: var(--glass-brd); }
:root:is([data-theme="neon"],[data-theme="corp"]) .hero .lattice { display: none; }
:root[data-theme="neon"] .eyebrow { color: var(--accent2); }
:root[data-theme="corp"] .eyebrow, :root[data-theme="corp"] .pitch-brand { color: var(--accent2-text); }
:root[data-theme="neon"] .brand svg g, :root[data-theme="corp"] .brand svg g { stroke: var(--accent); }
:root[data-theme="neon"] .brand b { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
/* الأزرار والاختيارات: متدرجة */
:root:is([data-theme="neon"],[data-theme="corp"]) :is(.months button.on, .seg button.on, .chip-btn[aria-pressed="true"]) { background: var(--grad); border-color: transparent; color: #fff; }
:root[data-theme="neon"] :is(.months button.on, .seg button.on, .chip-btn[aria-pressed="true"]) { box-shadow: 0 0 16px -4px #7C6CFF; }
:root:is([data-theme="neon"],[data-theme="corp"]) .btn:not(.ghost) { background: var(--grad); border-color: transparent; color: #fff; border-radius: 999px; padding-inline: 18px; }
:root[data-theme="neon"] .btn:not(.ghost) { box-shadow: 0 8px 24px -10px #B04DFF; }
:root[data-theme="corp"] .btn:not(.ghost) { background: linear-gradient(90deg, #F7731C, #FB923C); box-shadow: 0 8px 22px -10px #F7731C; }
:root:is([data-theme="neon"],[data-theme="corp"]) .btn.ghost { border-radius: 999px; }
:root[data-theme="neon"] .icon-btn { background: var(--glass); border-color: var(--glass-brd); color: #fff; }
:root[data-theme="neon"] .bar i, :root[data-theme="neon"] .wrbar span { background: var(--grad); }
:root[data-theme="neon"] .kpi .v.pos, :root[data-theme="neon"] .pos { text-shadow: 0 0 14px rgba(63,224,160,.35); }
:root[data-theme="neon"] .curve .ln { filter: drop-shadow(0 0 6px rgba(139,124,255,.7)); }
:root[data-theme="neon"] .curve .area { opacity: .22; }
:root[data-theme="neon"] .top { background: rgba(14,21,72,.82); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
:root[data-theme="neon"] .chip.demo { border-color: var(--accent2); color: var(--accent2); background: var(--accent2-soft); }
:root:is([data-theme="neon"],[data-theme="corp"]) .tag.quick { border-color: var(--c2); color: var(--c2); }
:root[data-theme="neon"] .tag.swing { border-color: var(--c3); color: var(--c3); }
/* الليلي: خلفية تتبدل لحالها بين 6 ألوان بتلاشي بطيء ما يحس فيه اللي فاتح الصفحة */
.nb { position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: 0; transition: opacity 14s ease-in-out; display: none; }
:root[data-theme="neon"] .nb { display: block; }
.nb.on { opacity: 1; }
.nb[data-p="0"] { background: radial-gradient(55% 34% at 50% -6%, rgba(77,130,255,.50), transparent 70%),
  radial-gradient(40% 45% at 100% 18%, rgba(176,77,255,.34), transparent 70%),
  radial-gradient(36% 42% at 0% 48%, rgba(34,211,238,.20), transparent 70%),
  radial-gradient(42% 40% at 96% 92%, rgba(63,224,160,.20), transparent 70%),
  radial-gradient(38% 36% at 8% 100%, rgba(176,77,255,.22), transparent 70%),
  linear-gradient(180deg, #0F1850, #121A55 50%, #0D1446); }
.nb[data-p="1"] { background: radial-gradient(55% 34% at 50% -6%, rgba(140,120,255,.55), transparent 70%), radial-gradient(40% 45% at 100% 18%, rgba(236,72,153,.28), transparent 70%), radial-gradient(36% 42% at 0% 50%, rgba(34,211,238,.20), transparent 70%), radial-gradient(42% 40% at 96% 92%, rgba(63,224,160,.18), transparent 70%), linear-gradient(180deg,#1C2160,#231F66 55%,#1A1D58); }
.nb[data-p="2"] { background: radial-gradient(55% 34% at 50% -6%, rgba(99,140,255,.45), transparent 70%), radial-gradient(40% 45% at 100% 18%, rgba(176,77,255,.40), transparent 70%), radial-gradient(36% 42% at 0% 50%, rgba(99,102,241,.30), transparent 70%), radial-gradient(42% 40% at 96% 92%, rgba(63,224,160,.16), transparent 70%), linear-gradient(180deg,#261A62,#2C1F6C 55%,#22175A); }
.nb[data-p="3"] { background: radial-gradient(55% 34% at 50% -6%, rgba(56,189,248,.45), transparent 70%), radial-gradient(40% 45% at 100% 18%, rgba(99,102,241,.30), transparent 70%), radial-gradient(36% 42% at 0% 50%, rgba(34,211,238,.25), transparent 70%), radial-gradient(42% 40% at 96% 92%, rgba(52,211,153,.28), transparent 70%), linear-gradient(180deg,#103059,#12365F 55%,#0E2950); }
.nb[data-p="4"] { background: radial-gradient(60% 30% at 30% -4%, rgba(63,224,160,.38), transparent 70%), radial-gradient(45% 35% at 85% 6%, rgba(176,77,255,.40), transparent 70%), radial-gradient(36% 42% at 0% 55%, rgba(34,211,238,.22), transparent 70%), radial-gradient(42% 40% at 96% 92%, rgba(176,77,255,.22), transparent 70%), linear-gradient(180deg,#142454,#172A5C 55%,#121F4C); }
.nb[data-p="5"] { background: radial-gradient(55% 34% at 50% -6%, rgba(176,77,255,.45), transparent 70%), radial-gradient(40% 45% at 100% 18%, rgba(247,115,28,.26), transparent 70%), radial-gradient(36% 42% at 0% 50%, rgba(236,72,153,.24), transparent 70%), radial-gradient(42% 40% at 96% 92%, rgba(61,139,255,.22), transparent 70%), linear-gradient(180deg,#2C1A4C,#34205A 55%,#281645); }

/* بطاقات الفئات فوق صفحة الأداء */
.cats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; padding-top: 20px; }
.cat { --c: var(--accent); position: relative; overflow: hidden; display: grid; justify-items: center; align-content: start; gap: 4px; text-align: center; text-decoration: none; color: var(--fg);
  border-radius: 20px; padding: 18px 12px 74px; border: 2px solid var(--c);
  background: linear-gradient(180deg, color-mix(in srgb, var(--c) 8%, var(--bg)), color-mix(in srgb, var(--c) 26%, var(--bg)));
  box-shadow: 0 0 20px -4px color-mix(in srgb, var(--c) 70%, transparent), inset 0 0 26px color-mix(in srgb, var(--c) 20%, transparent); transition: transform .2s; }
.cat:hover { transform: translateY(-3px); }
.cat b { font: 700 26px/1.2 var(--f-display); margin-top: 8px; }
.cat small { font-size: 12.5px; font-weight: 600; color: var(--c); }
.cat .d { font-size: 13.5px; color: var(--muted); line-height: 1.6; }
.cat .wave { position: absolute; inset: auto -2px -2px -2px; width: calc(100% + 4px); height: 66px; filter: drop-shadow(0 0 5px var(--c)); }
.cat .glass { position: relative; display: grid; place-items: center; width: 64px; height: 64px; border-radius: 19px; overflow: hidden;
  background: linear-gradient(150deg, rgba(255,255,255,.42), rgba(255,255,255,.10) 45%, color-mix(in srgb, var(--c) 22%, transparent));
  border: 1px solid rgba(255,255,255,.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  box-shadow: inset 0 1.5px 0 rgba(255,255,255,.9), inset 0 -10px 18px color-mix(in srgb, var(--c) 30%, transparent), 0 12px 26px -10px var(--c); }
.cat .glass::before { content: ""; position: absolute; inset: 3px 7px auto; height: 42%; border-radius: 16px 16px 40% 40%; background: linear-gradient(180deg, rgba(255,255,255,.55), transparent); }
.cat .glass svg { position: relative; width: 32px; height: 32px; fill: none; stroke: #fff; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; color: #fff; filter: drop-shadow(0 0 7px var(--c)); }
:root[data-theme="corp"] .cat { background: #fff; border: 1px solid var(--line); box-shadow: 0 12px 30px -18px rgba(29,78,216,.45); }
:root[data-theme="corp"] .cat small { color: var(--accent2-text); }
:root[data-theme="neon"] .cat small { color: color-mix(in srgb, var(--c) 65%, #fff); }
/* أزرار الإطار في الليلي: نص فاتح واضح */
:root[data-theme="neon"] .btn.ghost { color: #DCD6FF; border-color: rgba(190,180,255,.7); background: rgba(161,147,255,.12); }
:root[data-theme="neon"] .btn.ghost:hover { background: rgba(161,147,255,.22); }
:root[data-theme="corp"] .cat .wave { filter: none; }
:root[data-theme="corp"] .cat .glass { background: linear-gradient(150deg, #fff, #EEF3FF 55%, #D9E5FF); border-color: #fff; box-shadow: inset 0 1.5px 0 #fff, 0 10px 22px -10px rgba(29,78,216,.55); }
:root[data-theme="corp"] .cat .glass svg { stroke: #1D4ED8; color: #1D4ED8; filter: none; }
.shield { display: flex; width: fit-content; max-width: 100%; margin: 14px auto 0; align-items: center; gap: 10px; padding: 10px 22px; border-radius: 14px; font-weight: 600; font-size: 14.5px;
  background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); }
.shield svg { width: 24px; height: 24px; flex: none; fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
@media (max-width: 900px) { .cats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } .cat { padding: 14px 8px 60px; } .cat b { font-size: 22px; } .cat .d { font-size: 12.5px; } .cat .wave { height: 54px; } .cat .glass { width: 54px; height: 54px; } .cat .glass svg { width: 27px; height: 27px; } }
@media (prefers-reduced-motion: reduce) { .cat { transition: none; } }

/* اختيار الثيم في الإعدادات */
.theme-pick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.theme-pick .sw[style] { display: block; }
.theme-pick button { font: 600 13px var(--f-body); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; align-items: stretch; text-align: start; }
.theme-pick button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
.theme-pick .sw { height: 46px; border-radius: 8px; border: 1px solid rgba(0,0,0,.08); display: flex; overflow: hidden; }
.theme-pick .sw i { flex: 1; }
.theme-pick small { display: block; margin-top: 2px; color: var(--muted); font-weight: 400; font-size: 12px; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.6 var(--f-body); -webkit-tap-highlight-color: transparent; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: 0; align-self: start; height: 100vh; border-inline-end: 1px solid var(--line); background: var(--sunk);
  padding-block: calc(24px + env(safe-area-inset-top, 0px)) 20px; padding-inline: 20px; display: flex; flex-direction: column; gap: 24px; z-index: 30; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand b { font: 700 19px/1.1 var(--f-display); }
.brand small { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { text-decoration: none; color: var(--muted); padding: 10px 12px; border-radius: 9px; font-weight: 500; display: flex; align-items: center; gap: 10px; }
.nav a svg { flex: none; opacity: .8; }
.nav a:hover { background: var(--surface); color: var(--fg); }
.nav a.on { background: var(--surface); color: var(--fg); box-shadow: inset -2px 0 0 var(--accent); }
.rail-foot { margin-top: auto; display: grid; gap: 10px; }
.trial { padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.trial .k { font-size: 12px; color: var(--muted); }
.trial .v { font: 700 20px var(--f-display); margin: 2px 0 8px; }
.deep-trial { padding: 8px 12px; min-width: 170px; }
.deep-trial .v { font-size: 16px; margin: 0 0 6px; }
.bar { height: 6px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.fresh { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--win); flex: none; }
.dot.off { background: var(--loss); }

.top { display: none; }
.shade { display: none; }
main { min-width: 0; padding-block: 0 64px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); }
.hero { position: relative; overflow: hidden; margin-inline: calc(-1 * max(28px, env(safe-area-inset-right, 0px))) calc(-1 * max(28px, env(safe-area-inset-left, 0px)));
  padding-block: 34px 24px; padding-inline: max(28px, env(safe-area-inset-right, 0px)) max(28px, env(safe-area-inset-left, 0px));
  border-bottom: 1px solid var(--line); background: radial-gradient(120% 140% at 85% 0%, var(--glow), transparent 60%); }
.hero .lattice { position: absolute; inset: 0; width: 100%; height: 100%; color: var(--accent); opacity: .14; pointer-events: none;
  -webkit-mask-image: linear-gradient(to left, #000, transparent 70%); mask-image: linear-gradient(to left, #000, transparent 70%); }
.hero-in { position: relative; display: flex; flex-wrap: wrap; gap: 14px; align-items: end; justify-content: space-between; }
.eyebrow { font-size: 12px; letter-spacing: .06em; color: var(--accent); font-weight: 600; }
h1 { font: 700 clamp(26px, 4vw, 38px)/1.15 var(--f-display); margin: 6px 0 0; text-wrap: balance; }
.hero p { margin: 6px 0 0; color: var(--muted); max-width: 62ch; font-size: 14px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; border: 1px solid var(--line); background: var(--surface); color: var(--muted); white-space: nowrap; }

.pos { color: var(--win); } .neg { color: var(--loss); } .zero { color: var(--muted); }
.curve { width: 100%; height: auto; display: block; }
.curve .g line { stroke: var(--line); } .curve .g text { fill: var(--muted); font: 11px var(--f-num); }
.curve .zero-l { stroke: var(--muted); stroke-dasharray: 3 4; }
.curve .area { fill: var(--accent); opacity: .13; } .curve .ln { fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linejoin: round; }
.curve .dot { fill: var(--surface); stroke: var(--accent); stroke-width: 2.5; }
.caption { font-size: 12px; color: var(--muted); margin-top: 6px; }
.accts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-top: 14px; }

.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
table { width: 100%; border-collapse: collapse; min-width: 760px; }

td { padding: 11px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }

/* جدول مخطط: العناوين والقيم على نفس المحاذاة، وخطوط بين الأعمدة */
th, td, td.num, td.n { text-align: center; }
th + th, td + td { border-inline-start: 1px solid var(--line); }
.table-wrap td:nth-child(2), .table-wrap th:nth-child(2) { text-align: start; }
td .when { display: block; }
td.n, th.n { text-align: center; }
.sym { font: 600 15px var(--f-num); } .sym.ar { font: 700 15px var(--f-body); } .sym small { display: block; font: 400 12px var(--f-body); color: var(--muted); }
.lv { color: var(--muted); font-size: 12px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.win { background: var(--win-soft); color: var(--win); } .pill.win2 { background: var(--win); color: var(--surface); }
.pill.loss { background: var(--loss-soft); color: var(--loss); } .pill.live { background: var(--live-soft); color: var(--live); }
.pill.wait, .pill.muted { background: var(--wait-soft); color: var(--muted); }
.cn-card { --c: var(--muted); --cs: var(--wait-soft); background: var(--cs); border: 1px solid var(--line); border-inline-start: 4px solid var(--c); border-radius: 14px; padding: 14px 16px; min-width: 0; }
.cn-card.live { --c: var(--live); --cs: var(--live-soft); }
.cn-card.go { --c: var(--win); --cs: var(--win-soft); }
.cn-card.bad { --c: var(--loss); --cs: var(--loss-soft); }
.cn-card.hold { --c: var(--accent); --cs: var(--accent-soft); }
.cn-card-row { display: flex; align-items: center; gap: 14px; }
.cn-ic { font-size: 34px; line-height: 1; flex: none; }
.cn-card-t { flex: 1; min-width: 0; }

.cn-card-t span { font-size: 13px; color: var(--muted); }
.cn-card-t .num { white-space: nowrap; }
.cn-refresh { flex: none; width: 46px; height: 46px; border-radius: 12px; border: 1px solid var(--c); background: var(--surface); color: var(--c); display: grid; place-items: center; cursor: pointer; }
.cn-refresh:hover { background: var(--c); color: var(--surface); }
.cn-notes { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); display: grid; gap: 4px; font-size: 13px; font-weight: 500; overflow-wrap: anywhere; }

@media (max-width: 480px) { .cn-card { padding: 12px; } .cn-ic { font-size: 28px; } .cn-card-t b { font-size: 18px; } .cn-card-row { gap: 10px; } }
.cn-agents .cn-rep { white-space: normal; text-align: start; }

  .cn-agents .cn-m small.lv { display: block; margin-top: 2px; text-align: right; font-size: 11px; }
  .cn-agents td:first-child { width: 1%; padding-inline: 8px; }
}
.tag { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); }
.tag.quick { border-color: var(--live); color: var(--live); } .tag.swing { border-color: var(--accent); color: var(--accent); }

.arch { display: grid; gap: 10px; }

.arch-row .c small { display: block; font-size: 11px; color: var(--muted); } .arch-row .c b { font: 600 16px var(--f-num); }
.btn { font: 600 13px var(--f-body); border-radius: 10px; padding: 9px 14px; border: 1px solid var(--accent); background: var(--accent); color: var(--bg); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }

.exports { display: flex; gap: 8px; flex-wrap: wrap; }

.field label { font-size: 12px; color: var(--muted); }
.field input, .field select { font: 500 14px var(--f-body); background: var(--sunk); color: var(--fg); border: 1px solid var(--line); border-radius: 9px; padding: 10px 11px; width: 100%; }
.field input[type="checkbox"] { width: 18px; height: 18px; padding: 0; margin: 0; flex: none; accent-color: var(--accent); }

.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.panel h3 { font: 700 15px var(--f-display); margin: 4px 0 0; }
.lrow { display: flex; gap: 6px; } .lrow input { flex: 1; min-width: 0; }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }

.note { font-size: 13px; color: var(--muted); margin: 0; }
.note b { color: var(--fg); }
ol.steps { margin: 0; padding-inline-start: 20px; display: grid; gap: 6px; font-size: 14px; }

/* تقرير الطباعة (يتحول لـ PDF) */
#report-sheet { position: fixed; top: 0; left: -10000px; width: 794px; background: #fff; color: #0F1B1D; font: 14px/1.6 "IBM Plex Sans Arabic", sans-serif; padding: 44px 48px; direction: rtl; }
#report-sheet h1 { font: 700 28px "IBM Plex Sans Arabic", sans-serif; margin: 0 0 4px; color: #0F1B1D; }
#report-sheet .rs-sub { color: #5C6B69; font-size: 13px; margin-bottom: 18px; }
#report-sheet .rs-k { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
#report-sheet .rs-k div { border: 1px solid #D2DAD7; border-radius: 10px; padding: 10px 12px; }
#report-sheet .rs-k small { display: block; color: #5C6B69; font-size: 11px; }
#report-sheet .rs-k b { font: 600 18px "IBM Plex Mono", monospace; direction: ltr; unicode-bidi: isolate; }
#report-sheet table { min-width: 0; font-size: 12px; margin-bottom: 14px; }
#report-sheet th { background: #F1E8D6; color: #5C4A22; padding: 7px 8px; }
#report-sheet td { padding: 6px 8px; border-bottom: 1px solid #E3E8E6; }
#report-sheet h2 { font: 700 16px "IBM Plex Sans Arabic", sans-serif; margin: 16px 0 8px; color: #8E6F33; }
#report-sheet .rs-foot { margin-top: 18px; padding-top: 10px; border-top: 1px solid #D2DAD7; color: #5C6B69; font-size: 11px; display: flex; justify-content: space-between; }

@media (max-width: 1100px) { .grid2 { grid-template-columns: minmax(0, 1fr); } .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 12px; } .kpi:nth-child(3) { border: 0; padding-inline-start: 0; } }
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; inset: 0 0 0 auto; width: min(300px, 84vw); height: 100%; transform: translateX(calc(100% + 56px)); transition: transform .22s ease; box-shadow: -12px 0 40px rgba(0,0,0,.3); }
  .rail.open { transform: none; }
  .shade { display: block; position: fixed; inset: 0; background: var(--shade); z-index: 25; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .shade.on { opacity: 1; pointer-events: auto; }
  .top { display: flex; position: sticky; top: 0; z-index: 20; align-items: center; gap: 8px; background: var(--bg); border-bottom: 1px solid var(--line);
    padding-block: calc(10px + env(safe-area-inset-top, 0px)) 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .top .t { flex: 1; min-width: 0; font: 700 17px var(--f-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .hero { margin-inline: calc(-1 * max(16px, env(safe-area-inset-right, 0px))) calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
    padding-inline: max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-left, 0px)); padding-block: 20px 18px; }
  .hero h1 { font-size: 26px; }
  .top .theme-tog { display: inline-grid; } .hero .theme-tog { display: none; }
  .arch-row { grid-template-columns: minmax(0, 1fr) repeat(3, minmax(0, auto)); }
  .arch-row .exports { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: no-preference) {
  .enter-next { animation: sn .22s ease-out; } .enter-prev { animation: sp .22s ease-out; }
  @keyframes sn { from { opacity: 0; transform: translateX(-20px); } } @keyframes sp { from { opacity: 0; transform: translateX(20px); } }
}

.dp-kv small, .dp-proof small { color: var(--muted); font-size: 11px; }
.dp-kv b, .dp-proof b { font-size: 15px; }
.dp-kv em, .dp-proof em { font-style: normal; font-size: 11px; color: var(--muted); }
.dp-kv .win b, .dp-kv .win em, .dp-proof .win b { color: var(--win); }
.dp-kv .loss b, .dp-proof .loss b { color: var(--loss); }
.dp-tools { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: center; }
.dp-tg { cursor: pointer; }
.dp-tg.on { color: var(--fg); border-color: var(--accent); }
.dp-chart { height: min(62vh, 560px); min-height: 320px; direction: ltr; }
.dp-rsi { height: 120px; direction: ltr; border-top: 1px solid var(--line); }
.dp-legend .lg { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin: 0 4px 0 8px; }
.lg.acc { background: var(--accent); } .lg.loss { background: var(--loss); } .lg.win { background: var(--win); }
.dp-disc { margin: 0; }
.dp-panel.hot { border-top: 4px solid var(--loss); }
.dp-hot-band { border-top: 3px solid var(--loss); border-bottom: 3px solid var(--loss); color: var(--loss); font-weight: 700; padding: 8px 4px; text-align: start; }
#dp-sheet { position: fixed; inset: 0; z-index: 60; background: var(--shade); display: flex; justify-content: center; align-items: flex-start; overflow: auto; padding: 24px 12px; }
#dp-sheet[hidden] { display: none; }
.dp-sheet-in { background: var(--bg); border: 1px solid var(--line); border-radius: 16px; padding: 18px; width: min(860px, 100%); display: flex; flex-direction: column; gap: 12px; }
.dp-sheet-in h3 { margin: 0; font-size: 16px; }
.dp-sheet-in table { min-width: 0; width: 100%; }
.dp-sch { overflow-x: auto; }
.dp-sheet-in td, .dp-sheet-in th { padding: 8px 6px; }
.dp-sheet-in td.win, .chip.win { color: var(--win); } .dp-sheet-in td.loss, .chip.loss { color: var(--loss); }
@media (max-width: 600px) { .dp-sheet-in { padding: 12px; } .dp-sheet-in table { font-size: 12px; } .dp-tt td:nth-child(3), .dp-tt th:nth-child(3) { display: none; } .dp-sch td:nth-child(2) { white-space: nowrap; } .dp-chart { height: 56vh; } .dp-tools .chips-row { flex-wrap: nowrap; overflow-x: auto; } .dp-kv span { padding: 4px 8px; } .dp-kv b { font-size: 14px; } .dp-sym { font-size: 22px; } .dp-kv span { min-width: 0; flex: 1 1 28%; } }

/* سجل المحلل */

  if (/^month:/.test(state.period) && state.period !== "month:" + monthKey(new Date()) && !store.get("sentinel.pinned")) state.period = "month:" + monthKey(new Date());
  var saveView = function () { store.set("sentinel.view", JSON.stringify(state)); };

  function token() {

    render();
    fetch("https://api.github.com/repos/" + REPO + "/contents/" + FILE + "?t=" + Date.now(), {
      cache: "no-store", headers: { Authorization: "Bearer " + tk.t, Accept: "application/vnd.github.raw+json", "X-GitHub-Api-Version": "2022-11-28" }

      if (force) toast("تم تحديث البيانات");

  function decidedAt(s) { return (s.status === "tp1" || s.status === "tp2") ? D(s.tp1_at || s.closed_at) : (s.status === "stopped" || s.status === "timeout") ? D(s.closed_at) : null; }
  function isWin(s) { return s.status === "tp1" || s.status === "tp2" || (s.status === "timeout" && (s.pnl || 0) > 0); }
  function trialStart() { return DATA && DATA.trial_start ? D(DATA.trial_start) : null; }

    var now = new Date(), ts = trialStart() || now;
    if (p === "all") return { from: ts, to: now, label: "كل الفترة", key: "all" };
    if (p === "range") {

    var k = p.replace("month:", ""), y = +k.split("-")[0], m = +k.split("-")[1] - 1;

  }
  function filtered(range, strat) {

  }
  function insights(list) {

    ["mcap", "cat", "price", "timing", "strat"].forEach(function (key) {
      var rows = byDim(list, key).filter(function (x) { return x.g.dec >= MIN_N; });
      if (rows.length < 2) return;
      rows.sort(function (a, b) { return b.g.wr - a.g.wr || b.g.pnl - a.g.pnl; });
      var hi = rows[0], lo = rows[rows.length - 1];
      if (hi.g.wr - lo.g.wr < 0.15) return;
      out.push({ gap: hi.g.wr - lo.g.wr, html: "<b>" + DIMS[key][0] + ":</b> " + esc(hi.k) + ' نجحت <span class="num">' + hi.g.win + '</span> من <span class="num">' + hi.g.dec + '</span> (<span class="num ' + cls(hi.g.pnl) + '">' + money(hi.g.pnl, true) + "</span>)، مقابل " + esc(lo.k) + ' <span class="num">' + lo.g.win + '</span> من <span class="num">' + lo.g.dec + '</span> (<span class="num ' + cls(lo.g.pnl) + '">' + money(lo.g.pnl, true) + "</span>)." });
    });
    if (base.n && base.cancel / base.n >= 0.25) out.push({ gap: 0.1, html: "<b>الإلغاء:</b> " + Math.round(base.cancel / base.n * 100) + "% من التوصيات انلغت لأن السعر ما وصل الدخول. هذا يحمي من الدخول المتأخر، بس يعني فرص فاتت." });

  function rBuckets(list) {
    var B = [["خسارة أكثر من الوقف", -99, -1.05], ["خسارة لين الوقف", -1.05, -0.01], ["تعادل", -0.01, 0.01], ["ربح أقل من المخاطرة", 0.01, 1], ["ربح 1–2 ضعف المخاطرة", 1, 2], ["ربح فوق ضعفين", 2, 99]];
    var c = B.map(function () { return 0; });
    list.forEach(function (s) { var o = outcome(s); if (o === "open" || o === "cancel") return; var rk = riskOf(s); if (!rk) return; var r = s.pnl / rk; for (var i = 0; i < B.length; i++) if (r > B[i][1] && r <= B[i][2]) { c[i]++; break; } });
    var max = Math.max.apply(null, c.concat([1]));
